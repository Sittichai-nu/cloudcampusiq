<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CloudCampusIQ{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="{{ url_for('pages.home') }}">CloudCampusIQ</a>
            </div>
            <form class="nav-search" action="{{ url_for('pages.search') }}" method="get" role="search">
                <input
                    type="search"
                    name="q"
                    value="{{ request.args.get('q', '') }}"
                    placeholder="Search topics, lessons, objectives…"
                    aria-label="Search the site"
                >
                <button type="submit" aria-label="Search">Search</button>
            </form>
            <div class="nav-links">
                <a href="{{ url_for('pages.courses') }}">Courses</a>
                <a href="{{ url_for('pages.topics_index') }}">Topics</a>
                <a href="{{ url_for('pages.domains_index') }}">Domains</a>
                <a href="{{ url_for('pages.phases_index') }}">Phases</a>
                <a href="{{ url_for('pages.login') }}" class="btn-nav">Login</a>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <span class="footer-brand">CloudCampusIQ</span>
            <nav class="footer-links">
                <a href="{{ url_for('pages.courses') }}">Courses</a>
                <a href="{{ url_for('pages.topics_index') }}">Topics</a>
                <a href="{{ url_for('pages.domains_index') }}">Domains</a>
                <a href="{{ url_for('pages.phases_index') }}">Phases</a>
                <a href="{{ url_for('pages.diagrams') }}">Diagrams</a>
            </nav>
            <span class="footer-copy">© 2026 CloudCampusIQ</span>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
