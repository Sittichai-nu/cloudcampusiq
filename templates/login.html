{% extends 'base.html' %}

{% block title %}CloudCampusIQ | Login{% endblock %}

{% block content %}
<section class="login-section">
    <div class="container">
        <div class="login-card">
            <div class="login-header">
                <span class="section-eyebrow">Member access</span>
                <h1>Welcome Back</h1>
                <p>Sign in to continue your learning experience on CloudCampusIQ.</p>
            </div>
            <form id="loginForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required minlength="6">
                </div>
                <div id="formMessage" class="form-message" aria-live="polite"></div>
                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>
            <div class="login-links">
                <a href="#">Forgot password?</a>
                <a href="#">Sign up</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
