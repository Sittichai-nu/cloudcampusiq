code: PM101
title: "Business of IT: Project Management"
description: >
  How IT projects get proposed, planned, delivered, and closed, aligned to the
  CompTIA Project+ (PK0-005) exam objectives. Every lesson is browsable by exam
  domain, by project life cycle phase, and by topic, so a concept can be found
  from whichever direction you already know it.

  Lessons are published only after being individually verified against the
  official course material. A lesson that has not been re-verified simply does
  not appear here, rather than risk presenting unconfirmed content as settled.
